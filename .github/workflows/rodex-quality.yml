name: RODEX quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rodex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, and real-time tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Real-time response tests
        run: bun run test:realtime
