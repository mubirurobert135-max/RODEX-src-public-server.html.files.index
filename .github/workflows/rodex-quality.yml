name: RODEX quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rodex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: HTTP production smoke test
        run: |
          NODE_ENV=production PORT=42685 node dist/server.mjs >/tmp/rodex-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:42685/health >/tmp/rodex-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rodex-smoke.log
            exit 1
          fi
          grep -q '"server":"up"' /tmp/rodex-health.json
          curl -fsS http://127.0.0.1:42685/health/ready | grep -q '"server":"up"'
          curl -fsS http://127.0.0.1:42685/ | grep -q '<title>RODEX</title>'
          # With no credentials, web verification must NOT report fake success.
          code=$(curl -sS -o /tmp/rodex-web.json -w '%{http_code}' http://127.0.0.1:42685/api/rodex/verify-web)
          test "$code" = "503"
          grep -q '"status":"STANDBY"' /tmp/rodex-web.json

      - name: Real-time response tests
        run: bun run test:realtime

      - name: Action and tool execution tests
        run: bun run test:action

      - name: Orb and wake phrase tests
        run: bun run test:orb

      - name: Web search grounding integrity
        run: bun run test:grounding

      - name: Voice response and wake reliability
        run: bun run test:voice

      - name: Chat navigation and responsive UI regression
        run: bun run test:chat-ui

      - name: Human Presence and minimalist workspace integration
        run: bun run test:human-presence

      - name: Authentication access guards
        run: bun run test:auth

      - name: Multi-user isolation
        run: bun run test:multiuser

      - name: Recovery engine
        run: bun run test:recovery

      - name: Self-diagnostic checks
        run: bun run test:doctor

      - name: Agent and task workflow
        run: bun run test:agent

      - name: Reservation verification integrity
        run: bun run test:booking

      - name: Install isolated pinned Playwright Chromium
        run: |
          mkdir -p /tmp/rodex-browser-tools
          npm --prefix /tmp/rodex-browser-tools install --no-audit --no-fund --no-package-lock playwright@1.65.0
          node /tmp/rodex-browser-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Start RODEX for browser rendering checks
        run: |
          NODE_ENV=production PORT=42687 node dist/server.mjs >/tmp/rodex-3d-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:42687/health > /tmp/rodex-3d-health.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/rodex-3d-server.log
          exit 1

      - name: Verify WebGL pixels and responsive 3D canvas in Chromium
        run: node scripts/testRODEX3DBrowser.mjs

      - name: Save visual proof of real browser rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodex-3d-evidence
          path: /tmp/rodex-3d-*.png
          if-no-files-found: ignore
          retention-days: 3
