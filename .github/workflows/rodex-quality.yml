name: RODEX quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rodex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, build, and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: HTTP production smoke test
        run: |
          NODE_ENV=production PORT=42685 node dist/server.mjs >/tmp/rodex-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:42685/health >/tmp/rodex-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/rodex-smoke.log
            exit 1
          fi
          grep -q '"server":"up"' /tmp/rodex-health.json
          curl -fsS http://127.0.0.1:42685/health/ready | grep -q '"server":"up"'
          curl -fsS http://127.0.0.1:42685/ | grep -q '<title>RODEX</title>'
          # With no credentials, web verification must NOT report fake success.
          code=$(curl -sS -o /tmp/rodex-web.json -w '%{http_code}' http://127.0.0.1:42685/api/rodex/verify-web)
          test "$code" = "503"
          grep -q '"status":"STANDBY"' /tmp/rodex-web.json

      - name: Real-time response tests
        run: bun run test:realtime

      - name: Action and tool execution tests
        run: bun run test:action

      - name: Orb and wake phrase tests
        run: bun run test:orb

      - name: Web search grounding integrity
        run: bun run test:grounding

      - name: Voice response and wake reliability
        run: bun run test:voice

      - name: Authentication access guards
        run: bun run test:auth

      - name: Multi-user isolation
        run: bun run test:multiuser

      - name: Recovery engine
        run: bun run test:recovery

      - name: Self-diagnostic checks
        run: bun run test:doctor

      - name: Agent and task workflow
        run: bun run test:agent
